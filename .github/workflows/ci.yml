name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Check Worker configuration
        run: node dist/cli.js --github --strict
      - name: Smoke-test the reusable action
        uses: ./
        with:
          version: 0.8.1
      - name: Reject invalid strict input
        id: invalid-strict
        continue-on-error: true
        uses: ./
        with:
          strict: "yes"
          version: 0.8.1
      - name: Verify invalid strict input failed
        if: always()
        env:
          ACTION_OUTCOME: ${{ steps.invalid-strict.outcome }}
        run: test "$ACTION_OUTCOME" = failure
      - name: Reject invalid all input
        id: invalid-all
        continue-on-error: true
        uses: ./
        with:
          all: "yes"
          version: 0.8.1
      - name: Verify invalid all input failed
        if: always()
        env:
          ACTION_OUTCOME: ${{ steps.invalid-all.outcome }}
        run: test "$ACTION_OUTCOME" = failure
