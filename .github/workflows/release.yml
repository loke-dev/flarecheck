name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: npm pack
      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" flarecheck-*.tgz --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish to npm
        run: npm publish --access public
